<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="organza-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DDA0DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DA70D6;stop-opacity:1" />
    </linearGradient>
    <pattern id="delicate-embroidery" patternUnits="userSpaceOnUse" width="50" height="50">
      <g transform="translate(25,25)">
        <circle r="12" fill="#FFF" opacity="0.7"/>
        <path d="M-8,-8 Q0,-15 8,-8 Q15,0 8,8 Q0,15 -8,8 Q-15,0 -8,-8" fill="#FFB6C1" opacity="0.8"/>
        <circle r="6" fill="#DDA0DD" opacity="0.6"/>
        <circle r="3" fill="#FFF" opacity="0.9"/>
      </g>
    </pattern>
    <pattern id="pearl-work" patternUnits="userSpaceOnUse" width="25" height="25">
      <circle cx="12.5" cy="12.5" r="4" fill="#FFF" opacity="0.9"/>
      <circle cx="12.5" cy="12.5" r="2" fill="#F0F8FF" opacity="0.8"/>
      <circle cx="5" cy="5" r="2" fill="#FFF" opacity="0.7"/>
      <circle cx="20" cy="20" r="2" fill="#FFF" opacity="0.7"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#organza-bg)"/>
  
  <!-- Luxury organza saree -->
  <path d="M75,55 Q200,35 325,55 L305,345 Q200,365 95,345 Z" fill="url(#organza-bg)" opacity="0.85"/>
  
  <!-- Delicate embroidery -->
  <rect x="75" y="55" width="250" height="290" fill="url(#delicate-embroidery)" opacity="0.8"/>
  
  <!-- Pearl work overlay -->
  <rect x="85" y="65" width="230" height="270" fill="url(#pearl-work)" opacity="0.6"/>
  
  <!-- Luxury border with pearls -->
  <rect x="70" y="50" width="260" height="15" fill="#FFF" opacity="0.8"/>
  <rect x="70" y="335" width="260" height="15" fill="#FFF" opacity="0.8"/>
  <rect x="70" y="50" width="15" height="300" fill="#FFF" opacity="0.8"/>
  <rect x="315" y="50" width="15" height="300" fill="#FFF" opacity="0.8"/>
  
  <!-- Elegant embroidered motifs -->
  <g transform="translate(200,150)">
    <circle r="25" fill="none" stroke="#FFF" stroke-width="3" opacity="0.9"/>
    <circle r="18" fill="none" stroke="#FFB6C1" stroke-width="2" opacity="0.8"/>
    <circle r="12" fill="#FFF" opacity="0.8"/>
    <circle r="8" fill="#DDA0DD" opacity="0.7"/>
    <circle r="4" fill="#FFF" opacity="0.9"/>
  </g>
  
  <g transform="translate(140,220)">
    <circle r="15" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>
    <circle r="10" fill="#FFB6C1" opacity="0.7"/>
    <circle r="5" fill="#FFF" opacity="0.9"/>
  </g>
  
  <g transform="translate(260,280)">
    <circle r="15" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>
    <circle r="10" fill="#FFB6C1" opacity="0.7"/>
    <circle r="5" fill="#FFF" opacity="0.9"/>
  </g>
  
  <!-- Sheer organza effect -->
  <path d="M75,55 Q50,100 75,145 Q50,190 75,235 Q50,280 75,325 Q50,340 75,345" 
        fill="none" stroke="#FFF" stroke-width="1" opacity="0.5"/>
  <path d="M325,55 Q350,100 325,145 Q350,190 325,235 Q350,280 325,325 Q350,340 325,345" 
        fill="none" stroke="#FFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Pearl scattered effect -->
  <circle cx="120" cy="100" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="180" cy="120" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="240" cy="140" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="160" cy="300" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="220" cy="320" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="280" cy="200" r="2" fill="#FFF" opacity="0.8"/>
</svg>
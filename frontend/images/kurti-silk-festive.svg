<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#800020;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0002A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#600015;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <pattern id="festivePattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#FFD700" opacity="0.7"/>
      <path d="M15,15 L25,15 L25,25 L15,25 Z" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#F5F5F0"/>
  
  <!-- Kurti Body -->
  <path d="M75 80 Q75 75 80 75 L220 75 Q225 75 225 80 L225 280 Q225 285 220 285 L80 285 Q75 285 75 280 Z" fill="url(#silkGradient)"/>
  
  <!-- Neckline -->
  <ellipse cx="150" cy="85" rx="30" ry="15" fill="url(#goldBorder)"/>
  <ellipse cx="150" cy="85" rx="25" ry="12" fill="url(#silkGradient)"/>
  
  <!-- Sleeves -->
  <ellipse cx="65" cy="110" rx="25" ry="45" fill="url(#silkGradient)"/>
  <ellipse cx="235" cy="110" rx="25" ry="45" fill="url(#silkGradient)"/>
  
  <!-- Gold Border Pattern -->
  <rect x="75" y="75" width="150" height="8" fill="url(#goldBorder)"/>
  <rect x="75" y="277" width="150" height="8" fill="url(#goldBorder)"/>
  <rect x="75" y="75" width="8" height="210" fill="url(#goldBorder)"/>
  <rect x="217" y="75" width="8" height="210" fill="url(#goldBorder)"/>
  
  <!-- Festive Pattern Overlay -->
  <rect x="85" y="85" width="130" height="190" fill="url(#festivePattern)"/>
  
  <!-- Decorative Elements -->
  <g transform="translate(150,150)">
    <circle r="15" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle r="10" fill="none" stroke="#FFA500" stroke-width="1"/>
    <circle r="5" fill="#FFD700"/>
  </g>
  
  <!-- Traditional Motifs -->
  <g transform="translate(120,120)">
    <path d="M0,0 Q10,-5 20,0 Q15,10 10,15 Q5,10 0,0" fill="#FFD700" opacity="0.8"/>
  </g>
  <g transform="translate(160,200)">
    <path d="M0,0 Q10,-5 20,0 Q15,10 10,15 Q5,10 0,0" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Price Tag -->
  <g transform="translate(200,30)">
    <rect x="0" y="0" width="80" height="30" rx="5" fill="#FF4444"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">₹3,499</text>
  </g>
  
  <!-- Product Label -->
  <g transform="translate(20,350)">
    <rect x="0" y="0" width="160" height="25" rx="3" fill="rgba(0,0,0,0.8)"/>
    <text x="80" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Silk Festive Kurti</text>
  </g>
</svg>
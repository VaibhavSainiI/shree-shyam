<!-- Kurti 1: Printed Cotton Kurti -->
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cottonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4682B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    <pattern id="printPattern" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#87CEEB"/>
      <polygon points="7.5,2 10,7 5,7" fill="#FFF"/>
      <circle cx="7.5" cy="11" r="2" fill="#FFF"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#F0F8FF"/>
  
  <!-- Kurti body -->
  <rect x="80" y="60" width="140" height="280" fill="url(#cottonBlue)" stroke="#4682B4" stroke-width="2" rx="15"/>
  
  <!-- Print overlay -->
  <rect x="85" y="65" width="130" height="270" fill="url(#printPattern)" opacity="0.6" rx="12"/>
  
  <!-- Sleeves -->
  <ellipse cx="65" cy="100" rx="25" ry="50" fill="url(#cottonBlue)" stroke="#4682B4" stroke-width="2"/>
  <ellipse cx="235" cy="100" rx="25" ry="50" fill="url(#cottonBlue)" stroke="#4682B4" stroke-width="2"/>
  
  <!-- Neckline -->
  <ellipse cx="150" cy="80" rx="25" ry="15" fill="#F0F8FF"/>
  
  <!-- Side slits -->
  <rect x="80" y="280" width="5" height="60" fill="#F0F8FF"/>
  <rect x="215" y="280" width="5" height="60" fill="#F0F8FF"/>
  
  <!-- Buttons -->
  <circle cx="150" cy="90" r="3" fill="#FFF" stroke="#4682B4" stroke-width="1"/>
  <circle cx="150" cy="105" r="3" fill="#FFF" stroke="#4682B4" stroke-width="1"/>
  <circle cx="150" cy="120" r="3" fill="#FFF" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Hem -->
  <rect x="80" y="325" width="140" height="8" fill="#1E90FF"/>
  
  <!-- Price tag -->
  <rect x="215" y="20" width="70" height="30" fill="#FFF" stroke="#333" stroke-width="1" rx="5"/>
  <text x="230" y="32" font-family="Arial" font-size="10" fill="#4682B4" font-weight="bold">₹1,899</text>
  <text x="235" y="44" font-family="Arial" font-size="8" fill="#666">Cotton</text>
</svg>
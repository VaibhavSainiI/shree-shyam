<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="chiffon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F4F4F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#191970;stop-opacity:1" />
    </linearGradient>
    <pattern id="sequin-work" patternUnits="userSpaceOnUse" width="30" height="30">
      <circle cx="15" cy="15" r="4" fill="#C0C0C0" opacity="0.8"/>
      <circle cx="15" cy="15" r="2" fill="#FFF" opacity="0.9"/>
      <circle cx="7" cy="7" r="2" fill="#C0C0C0" opacity="0.6"/>
      <circle cx="23" cy="23" r="2" fill="#C0C0C0" opacity="0.6"/>
    </pattern>
    <pattern id="bead-border" patternUnits="userSpaceOnUse" width="15" height="15">
      <circle cx="7.5" cy="7.5" r="3" fill="#FFD700" opacity="0.8"/>
      <circle cx="7.5" cy="7.5" r="1.5" fill="#FFF" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#chiffon-bg)"/>
  
  <!-- Elegant chiffon saree -->
  <path d="M80,50 Q200,30 320,50 L300,350 Q200,370 100,350 Z" fill="url(#chiffon-bg)" opacity="0.9"/>
  
  <!-- Sequin work overlay -->
  <rect x="80" y="50" width="240" height="300" fill="url(#sequin-work)" opacity="0.7"/>
  
  <!-- Beaded border -->
  <rect x="70" y="40" width="15" height="320" fill="url(#bead-border)"/>
  <rect x="315" y="40" width="15" height="320" fill="url(#bead-border)"/>
  <rect x="70" y="40" width="260" height="15" fill="url(#bead-border)"/>
  <rect x="70" y="345" width="260" height="15" fill="url(#bead-border)"/>
  
  <!-- Elegant sequin patterns -->
  <g transform="translate(200,150)">
    <circle r="20" fill="none" stroke="#C0C0C0" stroke-width="2" opacity="0.8"/>
    <circle r="12" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
    <circle r="6" fill="#C0C0C0" opacity="0.7"/>
  </g>
  
  <g transform="translate(200,250)">
    <circle r="20" fill="none" stroke="#C0C0C0" stroke-width="2" opacity="0.8"/>
    <circle r="12" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6"/>
    <circle r="6" fill="#C0C0C0" opacity="0.7"/>
  </g>
  
  <!-- Flowing chiffon effect -->
  <path d="M80,50 Q60,100 80,150 Q60,200 80,250 Q60,300 80,350" 
        fill="none" stroke="#C0C0C0" stroke-width="1" opacity="0.4"/>
  <path d="M320,50 Q340,100 320,150 Q340,200 320,250 Q340,300 320,350" 
        fill="none" stroke="#C0C0C0" stroke-width="1" opacity="0.4"/>
  
  <!-- Shimmer effect -->
  <rect x="90" y="60" width="220" height="280" fill="url(#sequin-work)" opacity="0.3" transform="rotate(45 200 200)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="georgette-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </linearGradient>
    <pattern id="floral-print" patternUnits="userSpaceOnUse" width="50" height="50">
      <g transform="translate(25,25)">
        <circle r="8" fill="#FFF" opacity="0.7"/>
        <path d="M-12,0 Q-6,-12 0,-8 Q6,-12 12,0 Q6,12 0,8 Q-6,12 -12,0" fill="#FF69B4" opacity="0.6"/>
        <circle r="4" fill="#FFB6C1" opacity="0.8"/>
      </g>
    </pattern>
    <pattern id="contemporary-dots" patternUnits="userSpaceOnUse" width="25" height="25">
      <circle cx="12.5" cy="12.5" r="3" fill="#FFF" opacity="0.5"/>
      <circle cx="12.5" cy="12.5" r="1.5" fill="#FF1493" opacity="0.7"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#georgette-bg)"/>
  
  <!-- Lightweight georgette drape -->
  <path d="M70,60 Q200,40 330,60 L310,340 Q200,360 90,340 Z" fill="url(#georgette-bg)" opacity="0.8"/>
  
  <!-- Floral print overlay -->
  <rect x="70" y="60" width="260" height="280" fill="url(#floral-print)" opacity="0.8"/>
  
  <!-- Contemporary dots pattern -->
  <rect x="80" y="70" width="240" height="260" fill="url(#contemporary-dots)" opacity="0.6"/>
  
  <!-- Flowing edges to show lightness -->
  <path d="M70,60 Q50,80 70,100 Q50,120 70,140 Q50,160 70,180 Q50,200 70,220 Q50,240 70,260 Q50,280 70,300 Q50,320 70,340" 
        fill="none" stroke="#FFF" stroke-width="2" opacity="0.6"/>
  <path d="M330,60 Q350,80 330,100 Q350,120 330,140 Q350,160 330,180 Q350,200 330,220 Q350,240 330,260 Q350,280 330,300 Q350,320 330,340" 
        fill="none" stroke="#FFF" stroke-width="2" opacity="0.6"/>
  
  <!-- Delicate flowers -->
  <g transform="translate(150,150)">
    <circle r="12" fill="#FFF" opacity="0.8"/>
    <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#FF1493" stroke-width="2" opacity="0.7"/>
  </g>
  
  <g transform="translate(250,250)">
    <circle r="10" fill="#FFF" opacity="0.8"/>
    <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#FF1493" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Soft border -->
  <rect x="65" y="55" width="270" height="5" fill="#FFF" opacity="0.5"/>
  <rect x="65" y="340" width="270" height="5" fill="#FFF" opacity="0.5"/>
</svg>
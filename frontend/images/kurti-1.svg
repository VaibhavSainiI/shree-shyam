<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="kurti-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <pattern id="print-pattern" patternUnits="userSpaceOnUse" width="30" height="30">
      <circle cx="15" cy="15" r="5" fill="rgba(255,255,255,0.3)"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#kurti-grad)"/>
  <rect x="50" y="100" width="300" height="300" fill="url(#print-pattern)" rx="10"/>
  <path d="M150,100 L150,400" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M250,100 L250,400" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="200" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Cotton Printed Kurti</text>
  <text x="200" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">₹1,499</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="banarasi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    <pattern id="gold-work" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="8" fill="#FFD700" opacity="0.8"/>
      <path d="M20,5 L25,15 L35,15 L27,23 L30,33 L20,28 L10,33 L13,23 L5,15 L15,15 Z" fill="#FFD700" opacity="0.6"/>
    </pattern>
    <pattern id="zari-border" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#FFD700" opacity="0.3"/>
      <path d="M0,10 L20,10 M10,0 L10,20" stroke="#FFD700" stroke-width="2" opacity="0.7"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#banarasi-bg)"/>
  
  <!-- Saree drape -->
  <path d="M50,50 Q200,30 350,50 L330,350 Q200,370 70,350 Z" fill="url(#banarasi-bg)" opacity="0.9"/>
  
  <!-- Gold work pattern -->
  <rect x="50" y="50" width="300" height="300" fill="url(#gold-work)" opacity="0.8"/>
  
  <!-- Zari border -->
  <rect x="40" y="40" width="20" height="320" fill="url(#zari-border)"/>
  <rect x="340" y="40" width="20" height="320" fill="url(#zari-border)"/>
  <rect x="40" y="40" width="320" height="20" fill="url(#zari-border)"/>
  <rect x="40" y="340" width="320" height="20" fill="url(#zari-border)"/>
  
  <!-- Decorative motifs -->
  <g transform="translate(200,200)">
    <circle r="30" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.8"/>
    <path d="M-20,-20 L20,20 M20,-20 L-20,20" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Corner decorations -->
  <g transform="translate(80,80)">
    <path d="M0,0 Q15,-5 30,0 Q25,15 30,30 Q15,25 0,30 Q5,15 0,0" fill="#FFD700" opacity="0.7"/>
  </g>
  <g transform="translate(320,80)">
    <path d="M0,0 Q15,-5 30,0 Q25,15 30,30 Q15,25 0,30 Q5,15 0,0" fill="#FFD700" opacity="0.7"/>
  </g>
</svg>
<!-- Lehenga 1: Royal Red Lehenga -->
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    <pattern id="goldPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#8B0000"/>
      <circle cx="5" cy="5" r="1" fill="#FFD700"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#F5F5DC"/>
  
  <!-- Lehenga Skirt -->
  <path d="M50 150 Q150 140 250 150 L240 380 Q150 390 60 380 Z" fill="url(#redGradient)" stroke="#8B0000" stroke-width="2"/>
  
  <!-- Pleats -->
  <line x1="80" y1="150" x2="85" y2="380" stroke="#6B0000" stroke-width="1"/>
  <line x1="110" y1="150" x2="115" y2="380" stroke="#6B0000" stroke-width="1"/>
  <line x1="140" y1="150" x2="145" y2="380" stroke="#6B0000" stroke-width="1"/>
  <line x1="170" y1="150" x2="175" y2="380" stroke="#6B0000" stroke-width="1"/>
  <line x1="200" y1="150" x2="205" y2="380" stroke="#6B0000" stroke-width="1"/>
  <line x1="230" y1="150" x2="235" y2="380" stroke="#6B0000" stroke-width="1"/>
  
  <!-- Blouse -->
  <rect x="100" y="40" width="100" height="120" fill="url(#goldPattern)" stroke="#8B0000" stroke-width="2" rx="10"/>
  
  <!-- Sleeves -->
  <ellipse cx="85" cy="80" rx="20" ry="35" fill="url(#goldPattern)" stroke="#8B0000" stroke-width="2"/>
  <ellipse cx="215" cy="80" rx="20" ry="35" fill="url(#goldPattern)" stroke="#8B0000" stroke-width="2"/>
  
  <!-- Dupatta -->
  <path d="M80 60 Q150 30 220 60 Q200 80 180 90 Q150 95 120 90 Q100 80 80 60" fill="#FFD700" opacity="0.8" stroke="#DAA520" stroke-width="1"/>
  
  <!-- Embroidery on lehenga -->
  <circle cx="100" cy="200" r="8" fill="#FFD700"/>
  <circle cx="130" cy="220" r="6" fill="#FFD700"/>
  <circle cx="170" cy="210" r="7" fill="#FFD700"/>
  <circle cx="200" cy="230" r="8" fill="#FFD700"/>
  
  <!-- Border -->
  <rect x="50" y="360" width="200" height="20" fill="#FFD700" opacity="0.9"/>
  
  <!-- Price tag -->
  <rect x="220" y="20" width="70" height="30" fill="#FFF" stroke="#333" stroke-width="1" rx="5"/>
  <text x="235" y="32" font-family="Arial" font-size="10" fill="#8B0000" font-weight="bold">₹12,999</text>
  <text x="240" y="44" font-family="Arial" font-size="8" fill="#666">Designer</text>
</svg>
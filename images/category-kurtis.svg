<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="kurti-bg" cx="40%" cy="20%" r="90%">
      <stop offset="0%" style="stop-color:#55efc4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="kurti-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81ecec;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#74b9ff;stop-opacity:0.9" />
    </linearGradient>
    <pattern id="floral-print" patternUnits="userSpaceOnUse" width="50" height="50">
      <circle cx="25" cy="25" r="12" fill="rgba(255,255,255,0.3)"/>
      <path d="M25,15 L30,20 L35,15 L30,10 Z" fill="rgba(255,255,255,0.4)"/>
      <path d="M15,25 L20,30 L15,35 L10,30 Z" fill="rgba(255,255,255,0.4)"/>
      <path d="M35,25 L40,30 L35,35 L30,30 Z" fill="rgba(255,255,255,0.4)"/>
      <path d="M25,35 L30,40 L35,35 L30,30 Z" fill="rgba(255,255,255,0.4)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#kurti-bg)"/>
  
  <!-- Kurti silhouette -->
  <path d="M200,100 Q300,90 400,100 L380,320 Q300,330 220,320 Z" fill="url(#kurti-fabric)"/>
  
  <!-- Palazzo/pants -->
  <path d="M220,320 L380,320 L370,380 L350,380 L350,360 L250,360 L250,380 L230,380 Z" fill="url(#kurti-fabric)" opacity="0.8"/>
  
  <!-- Floral print pattern -->
  <rect x="200" y="100" width="200" height="220" fill="url(#floral-print)" opacity="0.6"/>
  
  <!-- Neckline decoration -->
  <ellipse cx="300" cy="120" rx="40" ry="15" fill="none" stroke="#ffd700" stroke-width="3"/>
  <ellipse cx="300" cy="120" rx="30" ry="10" fill="none" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Side panels -->
  <path d="M200,150 L220,150 L220,300 L200,300 Z" fill="rgba(255,255,255,0.2)"/>
  <path d="M380,150 L400,150 L400,300 L380,300 Z" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Decorative buttons -->
  <circle cx="300" cy="140" r="4" fill="#ffd700"/>
  <circle cx="300" cy="155" r="4" fill="#ffd700"/>
  <circle cx="300" cy="170" r="4" fill="#ffd700"/>
  
  <!-- Text overlay -->
  <rect x="0" y="320" width="600" height="80" fill="rgba(0,0,0,0.4)"/>
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">Kurtis</text>
  <text x="300" y="385" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="gold">Casual Comfort</text>
</svg>
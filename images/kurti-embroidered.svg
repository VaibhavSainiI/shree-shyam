<!-- Kurti 2: Embroidered Kurti -->
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="creamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#FFFAF0"/>
  
  <!-- Kurti body -->
  <rect x="75" y="55" width="150" height="290" fill="url(#creamGradient)" stroke="#D2B48C" stroke-width="2" rx="18"/>
  
  <!-- Sleeves -->
  <ellipse cx="60" cy="95" rx="28" ry="55" fill="url(#creamGradient)" stroke="#D2B48C" stroke-width="2"/>
  <ellipse cx="240" cy="95" rx="28" ry="55" fill="url(#creamGradient)" stroke="#D2B48C" stroke-width="2"/>
  
  <!-- Neckline -->
  <path d="M125 70 Q150 55 175 70 Q150 85 125 70" fill="#FFFAF0" stroke="#D2B48C" stroke-width="2"/>
  
  <!-- Embroidery -->
  <circle cx="120" cy="120" r="6" fill="#8B4513" opacity="0.7"/>
  <circle cx="140" cy="110" r="5" fill="#CD853F" opacity="0.7"/>
  <circle cx="160" cy="115" r="6" fill="#8B4513" opacity="0.7"/>
  <circle cx="180" cy="125" r="5" fill="#CD853F" opacity="0.7"/>
  
  <circle cx="130" cy="160" r="4" fill="#8B4513" opacity="0.7"/>
  <circle cx="150" cy="155" r="5" fill="#CD853F" opacity="0.7"/>
  <circle cx="170" cy="165" r="4" fill="#8B4513" opacity="0.7"/>
  
  <!-- Mirror work -->
  <rect x="110" y="200" width="8" height="8" fill="#FFD700" transform="rotate(45 114 204)"/>
  <rect x="130" y="210" width="6" height="6" fill="#FFD700" transform="rotate(45 133 213)"/>
  <rect x="160" y="195" width="8" height="8" fill="#FFD700" transform="rotate(45 164 199)"/>
  <rect x="180" y="205" width="6" height="6" fill="#FFD700" transform="rotate(45 183 208)"/>
  
  <!-- Border -->
  <rect x="75" y="325" width="150" height="12" fill="#8B4513" opacity="0.6"/>
  <rect x="75" y="337" width="150" height="8" fill="#CD853F" opacity="0.5"/>
  
  <!-- Price tag -->
  <rect x="210" y="15" width="75" height="35" fill="#FFF" stroke="#333" stroke-width="1" rx="5"/>
  <text x="225" y="27" font-family="Arial" font-size="10" fill="#8B4513" font-weight="bold">₹2,799</text>
  <text x="225" y="39" font-family="Arial" font-size="8" fill="#666">Embroidered</text>
</svg>
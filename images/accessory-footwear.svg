<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footwearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="strapGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <pattern id="ethnicPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#8B4513" opacity="0.6"/>
      <path d="M5,5 L15,5 M5,15 L15,15" stroke="#A0522D" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#F8F8FF"/>
  
  <!-- Left Shoe -->
  <g transform="translate(50,200)">
    <!-- Sole -->
    <ellipse cx="60" cy="80" rx="55" ry="25" fill="#654321"/>
    <!-- Main Shoe Body -->
    <path d="M10 60 Q5 50 15 45 L105 45 Q115 50 110 60 L110 75 Q105 85 95 85 L20 85 Q10 85 10 75 Z" fill="url(#footwearGradient)"/>
    <!-- Decorative Strap -->
    <rect x="15" y="50" width="90" height="8" rx="4" fill="url(#strapGradient)"/>
    <!-- Toe Design -->
    <path d="M15 45 Q25 40 35 45 Q30 55 25 60 Q20 55 15 45" fill="#FFD700"/>
    <!-- Ethnic Pattern -->
    <rect x="20" y="52" width="80" height="20" fill="url(#ethnicPattern)" opacity="0.7"/>
    <!-- Buckle -->
    <rect x="85" y="48" width="12" height="12" rx="2" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  </g>
  
  <!-- Right Shoe -->
  <g transform="translate(150,200)">
    <!-- Sole -->
    <ellipse cx="60" cy="80" rx="55" ry="25" fill="#654321"/>
    <!-- Main Shoe Body -->
    <path d="M10 60 Q5 50 15 45 L105 45 Q115 50 110 60 L110 75 Q105 85 95 85 L20 85 Q10 85 10 75 Z" fill="url(#footwearGradient)"/>
    <!-- Decorative Strap -->
    <rect x="15" y="50" width="90" height="8" rx="4" fill="url(#strapGradient)"/>
    <!-- Toe Design -->
    <path d="M15 45 Q25 40 35 45 Q30 55 25 60 Q20 55 15 45" fill="#FFD700"/>
    <!-- Ethnic Pattern -->
    <rect x="20" y="52" width="80" height="20" fill="url(#ethnicPattern)" opacity="0.7"/>
    <!-- Buckle -->
    <rect x="85" y="48" width="12" height="12" rx="2" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  </g>
  
  <!-- Decorative Elements -->
  <g transform="translate(150,120)">
    <circle r="20" fill="none" stroke="#DAA520" stroke-width="2" opacity="0.8"/>
    <circle r="15" fill="none" stroke="#B8860B" stroke-width="1" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#8B4513" font-family="Arial" font-size="14" font-weight="bold">✦</text>
  </g>
  
  <!-- Traditional Pattern Border -->
  <g stroke="#DAA520" stroke-width="2" fill="none" opacity="0.6">
    <path d="M30,350 Q50,340 70,350 Q90,360 110,350 Q130,340 150,350 Q170,360 190,350 Q210,340 230,350 Q250,360 270,350"/>
    <path d="M30,360 Q50,350 70,360 Q90,370 110,360 Q130,350 150,360 Q170,370 190,360 Q210,350 230,360 Q250,370 270,360"/>
  </g>
  
  <!-- Size Information -->
  <g transform="translate(20,80)">
    <rect x="0" y="0" width="60" height="20" rx="3" fill="rgba(139,69,19,0.8)"/>
    <text x="30" y="14" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">Size 5-9</text>
  </g>
  
  <!-- Price Tag -->
  <g transform="translate(200,30)">
    <rect x="0" y="0" width="80" height="30" rx="5" fill="#FF4444"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">₹1,599</text>
  </g>
  
  <!-- Product Label -->
  <g transform="translate(20,350)">
    <rect x="0" y="0" width="180" height="25" rx="3" fill="rgba(0,0,0,0.8)"/>
    <text x="90" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Traditional Footwear</text>
  </g>
</svg>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b0082;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Document icon -->
  <rect x="120" y="80" width="160" height="200" fill="white" rx="8"/>
  <rect x="120" y="80" width="160" height="40" fill="#f0f0f0" rx="8 8 0 0"/>
  
  <!-- Document lines -->
  <line x1="140" y1="140" x2="260" y2="140" stroke="#ccc" stroke-width="2"/>
  <line x1="140" y1="160" x2="240" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="140" y1="180" x2="250" y2="180" stroke="#ccc" stroke-width="2"/>
  <line x1="140" y1="200" x2="230" y2="200" stroke="#ccc" stroke-width="2"/>
  
  <!-- PDF icon -->
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8a2be2">PDF</text>
  
  <!-- Price tag -->
  <circle cx="320" cy="120" r="30" fill="#ff6b6b"/>
  <text x="320" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">₹770</text>
  
  <!-- Title -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Premium Catalog</text>
  <text x="200" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0">Complete Collection</text>
</svg>
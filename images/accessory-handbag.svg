<!-- Accessory 2: Designer Handbag -->
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
    </linearGradient>
    <pattern id="leatherTexture" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#8B4513"/>
      <circle cx="4" cy="4" r="1" fill="#A0522D" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="#FFFAF0"/>
  
  <!-- Handbag body -->
  <path d="M70 150 Q150 140 230 150 L220 320 Q150 330 80 320 Z" fill="url(#bagGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- Leather texture overlay -->
  <path d="M72 152 Q150 142 228 152 L218 318 Q150 328 82 318 Z" fill="url(#leatherTexture)" opacity="0.3"/>
  
  <!-- Handle -->
  <ellipse cx="150" cy="120" rx="40" ry="15" fill="none" stroke="url(#bagGradient)" stroke-width="8"/>
  <ellipse cx="150" cy="120" rx="35" ry="12" fill="none" stroke="#654321" stroke-width="2"/>
  
  <!-- Zipper -->
  <line x1="80" y1="160" x2="220" y2="160" stroke="#C0C0C0" stroke-width="3"/>
  <rect x="148" y="157" width="4" height="6" fill="#C0C0C0"/>
  
  <!-- Buckle/clasp -->
  <rect x="140" y="170" width="20" height="8" fill="#FFD700" stroke="#DAA520" stroke-width="1" rx="2"/>
  
  <!-- Stitching details -->
  <line x1="75" y1="155" x2="75" y2="315" stroke="#654321" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="225" y1="155" x2="225" y2="315" stroke="#654321" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- Brand logo area -->
  <rect x="120" y="220" width="60" height="30" fill="#FFD700" opacity="0.3" rx="5"/>
  <text x="135" y="235" font-family="Arial" font-size="8" fill="#654321" font-weight="bold">DESIGNER</text>
  <text x="138" y="245" font-family="Arial" font-size="6" fill="#654321">COLLECTION</text>
  
  <!-- Decorative studs -->
  <circle cx="90" cy="180" r="3" fill="#C0C0C0"/>
  <circle cx="210" cy="180" r="3" fill="#C0C0C0"/>
  <circle cx="90" cy="300" r="3" fill="#C0C0C0"/>
  <circle cx="210" cy="300" r="3" fill="#C0C0C0"/>
  
  <!-- Side pockets -->
  <ellipse cx="85" cy="240" rx="8" ry="25" fill="none" stroke="#654321" stroke-width="1"/>
  <ellipse cx="215" cy="240" rx="8" ry="25" fill="none" stroke="#654321" stroke-width="1"/>
  
  <!-- Base -->
  <ellipse cx="150" cy="320" rx="70" ry="8" fill="#654321"/>
  
  <!-- Price tag -->
  <rect x="205" y="20" width="85" height="35" fill="#FFF" stroke="#333" stroke-width="1" rx="5"/>
  <text x="218" y="32" font-family="Arial" font-size="10" fill="#8B4513" font-weight="bold">₹2,499</text>
  <text x="225" y="44" font-family="Arial" font-size="8" fill="#666">Handbag</text>
</svg>
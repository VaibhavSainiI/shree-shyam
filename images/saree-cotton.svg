<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cotton-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F8FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>
    <pattern id="block-print" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#4682B4" opacity="0.3"/>
      <circle cx="20" cy="20" r="8" fill="#191970" opacity="0.6"/>
      <rect x="15" y="15" width="10" height="10" fill="#FFF" opacity="0.8"/>
      <path d="M10,10 L30,30 M30,10 L10,30" stroke="#191970" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="handloom-texture" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#B0E0E6" opacity="0.4"/>
      <path d="M0,10 L20,10 M10,0 L10,20" stroke="#4682B4" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#cotton-bg)"/>
  
  <!-- Cotton handloom saree -->
  <path d="M70,60 Q200,40 330,60 L310,340 Q200,360 90,340 Z" fill="url(#cotton-bg)" opacity="0.9"/>
  
  <!-- Handloom texture -->
  <rect x="70" y="60" width="260" height="280" fill="url(#handloom-texture)" opacity="0.8"/>
  
  <!-- Traditional block prints -->
  <rect x="90" y="80" width="220" height="240" fill="url(#block-print)" opacity="0.7"/>
  
  <!-- Simple cotton border -->
  <rect x="65" y="55" width="270" height="10" fill="#4682B4" opacity="0.6"/>
  <rect x="65" y="335" width="270" height="10" fill="#4682B4" opacity="0.6"/>
  <rect x="65" y="55" width="10" height="290" fill="#4682B4" opacity="0.6"/>
  <rect x="325" y="55" width="10" height="290" fill="#4682B4" opacity="0.6"/>
  
  <!-- Block print motifs -->
  <g transform="translate(150,150)">
    <rect x="-15" y="-15" width="30" height="30" fill="#191970" opacity="0.7"/>
    <circle r="10" fill="#FFF" opacity="0.8"/>
    <circle r="5" fill="#4682B4" opacity="0.6"/>
  </g>
  
  <g transform="translate(250,200)">
    <rect x="-15" y="-15" width="30" height="30" fill="#191970" opacity="0.7"/>
    <circle r="10" fill="#FFF" opacity="0.8"/>
    <circle r="5" fill="#4682B4" opacity="0.6"/>
  </g>
  
  <g transform="translate(150,250)">
    <rect x="-15" y="-15" width="30" height="30" fill="#191970" opacity="0.7"/>
    <circle r="10" fill="#FFF" opacity="0.8"/>
    <circle r="5" fill="#4682B4" opacity="0.6"/>
  </g>
  
  <!-- Natural cotton texture lines -->
  <path d="M80,70 Q200,65 320,70 M80,120 Q200,115 320,120 M80,170 Q200,165 320,170 M80,220 Q200,215 320,220 M80,270 Q200,265 320,270 M80,320 Q200,315 320,320" 
        stroke="#4682B4" stroke-width="0.5" opacity="0.4" fill="none"/>
</svg>